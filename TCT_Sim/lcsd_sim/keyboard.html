<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCT Keyboard</title>
<style>
  :root { --u: 46px; --gap: 5px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: #e9ecef; font: 12px/1.2 system-ui, "Sarabun", sans-serif; }
  .case { display: inline-block; padding: 10px 14px 14px; border-radius: 16px; max-width: 100%; overflow-x: auto;
          background: linear-gradient(#2a2d32, #1c1e22); box-shadow: inset 0 2px 0 #3a3e44, 0 8px 22px rgba(0,0,0,.5); }
  .strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; margin-bottom: 10px;
           padding: 0 6px; border-radius: 6px; background: #121316; }
  .strip .label { background: #f2f2f2; color: #333; font-size: 9px; padding: 4px 8px; border-radius: 3px; line-height: 1.25; }
  .strip .brand { color: #f2f2f2; text-align: right; font-weight: 800; font-size: 20px; letter-spacing: .5px; line-height: 1; }
  .strip .brand small { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0; color: #cfd3d8; }
  .grid { display: grid; grid-template-columns: repeat(4, var(--u)) 14px repeat(14, var(--u));
          grid-template-rows: repeat(8, var(--u)); gap: var(--gap); }
  .k { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center;
       border-radius: 5px; background: #2a2c30; color: #e9ecef; font-weight: 700; font-size: 11.5px; padding: 2px;
       box-shadow: 0 3px 0 #0b0c0e, inset 0 1px 0 rgba(255,255,255,.14); user-select: none; line-height: 1.15; }
  .k.blank { background: #1f2124; cursor: default; box-shadow: 0 3px 0 #0b0c0e, inset 0 1px 0 rgba(255,255,255,.05); }
  .k:not(.blank):active, .k.hit { transform: translateY(2px); box-shadow: 0 1px 0 #0b0c0e; filter: brightness(1.25); }
  .k.num { font-size: 17px; } .k.small { font-size: 9.5px; } .k.big { font-size: 15px; }
  .k.nomap::after { content: "•"; position: absolute; } .k.nomap { opacity: .55; position: relative; }
  .green{background:#1d9a4d;color:#fff} .blue{background:#1e63b8;color:#fff} .white{background:#ececec;color:#222}
  .pink{background:#f08fb5;color:#3a0d1b} .red{background:#d6283b;color:#fff} .orange{background:#f2872e;color:#2a1405}
  .yellow{background:#f5d424;color:#2a2300} .purple{background:#8b5cc4;color:#fff} .lteal{background:#73cfd2;color:#08302f}
  .teal{background:#18a99b;color:#fff} .navy{background:#2b4673;color:#fff} .coupon{background:#0f8f6f;color:#fff}
  .x { color: #d6283b; font-size: 22px; } .dn { color: #1d9a4d; font-size: 22px; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 8px 2px 0; color: #8b95a3; font-size: 12px; flex-wrap: wrap; }
  .bar b { color: #e9ecef; }
</style>
</head>
<body>
<div class="case">
  <div class="strip">
    <span class="label">Keyboard Input Panel<br>TB-DM-025 · TCT Simulator</span>
    <span class="brand">Cherry<small>Toll Keyboard</small></span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="bar">
  <span>ล่าสุด: <b id="last">-</b></span>
  <span>คลิกปุ่ม หรือพิมพ์บนคีย์บอร์ด PC ขณะหน้านี้ active</span>
  <span>ปุ่มมีจุด = TCT ไม่ได้ map ไว้ (กดแล้วไม่มีผล)</span>
</div>
<script>
// ตำแหน่งตามคีย์บอร์ดจริง (Cherry Toll Keyboard): [label, keysym ที่ส่ง, สี, col, row, colspan, rowspan, class]
// col 1-4 = บล็อกซ้าย, col 5 = ร่องแบ่ง, col 6-19 = บล็อกขวา ; keysym ตาม TCT_Lib.keyMapping (null = ไม่ได้ map)
const R = (j) => 6 + j;           // คอลัมน์ของบล็อกขวา (j = 0..13)
const KEYS = [
  ['MODE','d','green',1,1], ['BOJ/<br>EOJ','j','blue',2,1,1,1,'small'], ['<span class="x">✕</span>','w','white',3,1],
  ['<span class="dn">⬇</span>','a','white',4,1],
  ['MANUAL','g','pink',1,2,2], ['Simulation',null,'lteal',4,2,1,1,'small'],
  ['7','7','',1,4,1,1,'num'], ['8','8','',2,4,1,1,'num'], ['9','9','',3,4,1,1,'num'], ['BACK<br>SPACE','BackSpace','',4,4,1,1,'small'],
  ['4','4','',1,5,1,1,'num'], ['5','5','',2,5,1,1,'num'], ['6','6','',3,5,1,1,'num'], ['CANCEL','p','',4,5,1,1,'small'],
  ['1','1','',1,6,1,1,'num'], ['2','2','',2,6,1,1,'num'], ['3','3','',3,6,1,1,'num'], ['END','End','',4,6,1,1,'small'],
  ['0','0','',1,7,1,1,'num'], ['↑','Up','',2,7,1,1,'num'], ['.','period','',3,7,1,1,'num'], ['ENTER','Return','',4,7,1,2,'small'],
  ['←','Left','',1,8,1,1,'num'], ['↓','Down','',2,8,1,1,'num'], ['→','Right','',3,8,1,1,'num'],
  // บล็อกขวา
  ['แก้ไข','n','red',R(1),1,2], ['รถฝ่าด่าน','o','orange',R(4),1,2], ['FORCE RESET','s','yellow',R(7),1,2,1,'small'],
  ['พิมพ์ใบเสร็จ','e','purple',R(12),1,2],
  ['ขายคูปอง','l','yellow',R(2),3,2], ['Payment 9','backslash','white',R(6),3,2,1,'small'], ['QR CODE','q','teal',R(8),3,2,1,'small'],
  ['คูปอง','r','coupon',R(10),3,2,2,'big'], ['คูปอง','r','coupon',R(12),3,2,2,'big'],
  ['รถออกซ้าย','m','pink',R(0),4,2], ['รถขบวน<br>จ่ายเงิน','h','green',R(4),4,2,1,'small'],
  ['Payment 8','bracketright','white',R(6),4,2,1,'small'], ['EMV','k','pink',R(8),4,2],
  ['รถลากจูง','b','teal',R(0),5,2], ['รถขบวน','f','purple',R(4),5,2], ['Payment 7','bracketleft','white',R(6),5,2,1,'small'],
  ['เงินสด','c','navy',R(8),5,2,2,'big'], ['เงินสด','c','navy',R(10),5,2,2,'big'], ['เงินสด','c','navy',R(12),5,2,2,'big'],
  ['ยืนยัน','t','pink',R(2),6,2], ['QR(KBANK)','equal','white',R(6),6,2,1,'small'],
  ['รถประเภท<br>2','v','red',R(8),7,2,2,'big'], ['รถประเภท<br>1','u','yellow',R(10),7,2,2,'big'],
  ['รถประเภท<br>1','u','yellow',R(12),7,2,2,'big'],
  ['บัตร DMT','x','purple',R(0),8,2], ['รถยกเว้น','z','lteal',R(4),8,2],
];
const NAMES = {d:'MODE', j:'BOJ/EOJ', w:'OTL ปิด (✕)', a:'OTL เปิด (⬇)'};
const grid = document.getElementById('grid'), keyEls = {}, used = new Set();
for (const [label, ks, color, col, row, cs = 1, rs = 1, extra = ''] of KEYS) {
  const b = document.createElement('button');
  b.className = `k ${color} ${extra}` + (ks ? '' : ' nomap');
  b.innerHTML = label;
  b.style.gridColumn = `${col} / span ${cs}`;
  b.style.gridRow = `${row} / span ${rs}`;
  const name = NAMES[ks] || label.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  b.title = ks ? `${name} → ส่ง "${ks}"` : `${name} (TCT ไม่ได้ map)`;
  b.onclick = () => press(ks, name, b);
  if (ks) (keyEls[ks] ||= []).push(b);
  grid.appendChild(b);
  for (let c = col; c < col + cs; c++) for (let r = row; r < row + rs; r++) used.add(`${c},${r}`);
}
// ปุ่มดำเปล่าในช่องที่เหลือ (เหมือนคีย์บอร์ดจริง)
for (let r = 1; r <= 8; r++) for (let c = 1; c <= 19; c++) {
  if (c === 5 || used.has(`${c},${r}`)) continue;
  const b = document.createElement('div');
  b.className = 'k blank';
  b.style.gridColumn = c; b.style.gridRow = r;
  grid.appendChild(b);
}

function press(ks, name, el) {
  document.getElementById('last').textContent = ks ? `[${name}] → ${ks}` : `[${name}] (TCT ไม่ได้ map)`;
  if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 140); }
  fetch('/api', {method: 'POST', headers: {'Content-Type': 'application/json'},
                 body: JSON.stringify({action: 'kb', k: ks, name})});
}

// คีย์บอร์ด PC -> แป้นเดียวกับคีย์บอร์ดจริง
const PC = {Enter:'Return', Backspace:'BackSpace', Escape:'p', End:'End', ArrowUp:'Up', ArrowDown:'Down',
            ArrowLeft:'Left', ArrowRight:'Right', '.':'period', '=':'equal', '[':'bracketleft', ']':'bracketright', '\\':'backslash'};
document.addEventListener('keydown', e => {
  const ks = PC[e.key] || (/^[a-z0-9]$/.test(e.key) ? e.key : null);
  if (!ks) return;
  e.preventDefault();
  const el = (keyEls[ks] || [])[0];
  press(ks, el ? el.title.split(' →')[0] : e.key, el);
});
</script>
</body>
</html>
