<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFI (จำลอง)</title>
<style>
/* จอ TFI จำลอง: แสดงค่าล่าสุดที่ TCT สั่งด้วย WRTFI (state / pattern / text) - บรรทัดที่ว่างไม่แสดง,
   แถวประเภท/ค่าผ่านทางแสดงเฉพาะหน้า Class_Fare / Class_Fare_Payment / ETC_Balance (state 4-6) */
:root{--bg:#101418;--fg:#d6dde5;--mute:#7d8a97;--line:#26303a;--led:#ffb000;--ledoff:#2a2112}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:12px}
.wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.board{background:#000;border:10px solid #2b2f33;border-radius:10px;width:min(520px,100%);aspect-ratio:16/7;padding:14px 18px;
  display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:0 0 0 2px #1a1d20 inset;position:relative;
  background-image:radial-gradient(#181818 1px,transparent 1px);background-size:6px 6px}
.ln{color:var(--led);text-shadow:0 0 6px rgba(255,176,0,.65);font-weight:700;text-align:center;line-height:1.15;word-break:break-word}
.big{font-size:clamp(26px,6vw,44px)}.mid{font-size:clamp(18px,4vw,28px)}
.row{display:flex;justify-content:center;gap:24px}
.p5 .ln{color:#3dff7a;text-shadow:0 0 6px rgba(61,255,122,.6)}       /* pattern 5 (HPMC) */
.p9 .ln{color:#ff4040;text-shadow:0 0 6px rgba(255,64,64,.65)}       /* pattern 9 (violation) */
.off .ln{color:var(--ledoff);text-shadow:none}
.tag{position:absolute;top:6px;right:10px;font-size:11px;color:#555}
.info{flex:1 1 240px;min-width:220px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="board" class="board off"><span class="tag" id="tag"></span><div id="lines"><div class="ln big">TFI</div></div></div>
  <div class="info">
    <h3>คำสั่ง WRTFI ล่าสุดจาก TCT</h3>
    <table id="cur"></table>
    <h3 style="margin-top:10px">ประวัติ</h3>
    <table><thead><tr><th>เวลา</th><th>state</th><th>pattern</th><th>ข้อความ</th></tr></thead><tbody id="hist"></tbody></table>
  </div>
</div>
<script>
const STATE = {0:'StartScreen',1:'CloseLane',2:'Maintenance',3:'Welcome',4:'Class_Fare',5:'Class_Fare_Payment',6:'ETC_Balance',
               7:'Alert_ETC_No_TAG',8:'Topup',9:'ThankYou',10:'ScreenOff',11:'HPMC'};
const PATTERN = {0:'Normal',5:'HPMC',9:'Violation'};
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(t){
  const b = document.getElementById('board');
  const blank = !t.text1 && !t.text2 && !t.text_class && !t.text_fare && !t.text_balance;
  b.className = 'board p' + t.pattern + ((t.state === 10 || blank) ? ' off' : '');
  const lines = [];
  if (t.text1) lines.push(`<div class="ln big">${esc(t.text1)}</div>`);
  const cf = [];
  if (t.text_class) cf.push(`ประเภท ${esc(t.text_class)}`);
  if (t.text_fare) cf.push(`${esc(t.text_fare)} บาท`);
  if (t.text_balance) cf.push(`คงเหลือ ${esc(t.text_balance)}`);
  if (cf.length && [4, 5, 6].includes(t.state)) lines.push(`<div class="ln mid row">${cf.map(x => `<span>${x}</span>`).join('')}</div>`);
  if (t.text2) lines.push(`<div class="ln mid">${esc(t.text2)}</div>`);
  document.getElementById('lines').innerHTML = lines.join('') || '<div class="ln big">&nbsp;</div>';
  document.getElementById('tag').textContent = `${STATE[t.state] ?? t.state} · ${PATTERN[t.pattern] ?? t.pattern} · ${t.mode ? 'กลางคืน' : 'กลางวัน'}`;
  document.getElementById('cur').innerHTML = [['เวลา', t.time], ['คำสั่ง', t.cmd], ['state', `${t.state} (${STATE[t.state] ?? '?'})`],
    ['pattern', `${t.pattern} (${PATTERN[t.pattern] ?? '?'})`], ['text_class', t.text_class], ['text_fare', t.text_fare],
    ['text_balance', t.text_balance], ['text1', t.text1], ['text2', t.text2]]
    .map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('');
}
async function tick(){
  try {
    const r = await (await fetch('api/tfi')).json();
    render(r.tfi);
    document.getElementById('hist').innerHTML = r.history.slice(0, 15).map(h =>
      `<tr><td>${esc(h.time)}</td><td>${h.state}</td><td>${h.pattern}</td><td>${esc([h.text1, h.text_class && 'C' + h.text_class, h.text_fare && h.text_fare + '฿', h.text2].filter(Boolean).join(' / ') || h.cmd)}</td></tr>`).join('');
  } catch (e) {}
}
tick(); setInterval(tick, 700);
</script>
</body>
</html>
